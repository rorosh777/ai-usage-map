<title>오륙도 연락망</title>

<meta name="apple-mobile-web-app-title" content="오륙도연락망">

<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --accent: #2b6cb0;
    --accent-dark: #1a4971;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --danger-bg: #16a34a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  header {
    padding: 18px 16px 12px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  header h1 {
    margin: 0 0 10px;
    font-size: 19px;
  }
  #searchBox {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
  }
  #searchBox:focus { border-color: var(--accent); }

  main {
    padding: 12px;
    max-width: 640px;
    margin: 0 auto;
  }

  .dept-group { margin-bottom: 18px; }
  .dept-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    margin: 4px 4px 8px;
    letter-spacing: 0.02em;
  }

  .contact-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }

  .contact-btn {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 10px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.15s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-height: 76px;
    justify-content: center;
  }
  .contact-btn:active {
    transform: scale(0.96);
    box-shadow: inset 0 0 0 2px var(--accent);
  }
  .contact-name {
    font-size: 15px;
    font-weight: 600;
  }
  .contact-role {
    font-size: 12px;
    color: var(--muted);
  }

  #emptyMsg {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
    display: none;
  }

  /* 정보 카드 (바텀시트) */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 20;
  }
  .overlay.open { display: flex; }

  .sheet {
    background: var(--card-bg);
    width: 100%;
    max-width: 480px;
    border-radius: 18px 18px 0 0;
    padding: 22px 20px 28px;
    animation: slideUp 0.18s ease-out;
  }
  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .sheet-name {
    font-size: 21px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .sheet-role {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .sheet-row {
    display: flex;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .sheet-row:last-of-type { border-bottom: none; }
  .sheet-row .label { color: var(--muted); }

  .call-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    margin-top: 18px;
    padding: 15px;
    background: var(--danger-bg);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
  }
  .call-btn:active { opacity: 0.85; }

  .close-btn {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 14px;
  }

  .no-phone-note {
    margin-top: 14px;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
  }
</style>

  <h1>📞 오륙도 연락망</h1>
  <input id="searchBox" type="text" placeholder="이름 또는 업무로 검색">
</header>

<main id="mainArea"></main>
<p id="emptyMsg">검색 결과가 없습니다.</p>

    <div id="sheetDetails"></div>
    <a href="#" id="callBtn" class="call-btn">☎️ 전화 걸기</a>
    <div class="no-phone-note" id="noPhoneNote" style="display:none;">등록된 전화번호가 없습니다.</div>
    <button class="close-btn" onclick="closeSheet()">닫기</button>

const mainArea = document.getElementById('mainArea');
const emptyMsg = document.getElementById('emptyMsg');
const searchBox = document.getElementById('searchBox');
const overlay = document.getElementById('overlay');

function render(list) {
  mainArea.innerHTML = '';

  if (list.length === 0) {
    emptyMsg.style.display = 'block';
    return;
  }
  emptyMsg.style.display = 'none';

  // 부서별로 그룹핑
  const groups = {};
  list.forEach(c => {
    if (!groups[c.dept]) groups[c.dept] = [];
    groups[c.dept].push(c);
  });

  Object.keys(groups).forEach(dept => {
    const groupDiv = document.createElement('div');
    groupDiv.className = 'dept-group';

    const title = document.createElement('div');
    title.className = 'dept-title';
    title.textContent = dept;
    groupDiv.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'contact-grid';

    groups[dept].forEach(c => {
      const displayRole = c.role || c.dept;
      const btn = document.createElement('div');
      btn.className = 'contact-btn';
      btn.innerHTML = `<div class="contact-name">${escapeHtml(c.name)}</div><div class="contact-role">${escapeHtml(displayRole)}</div>`;
      btn.addEventListener('click', () => openSheet(c));
      grid.appendChild(btn);
    });

    groupDiv.appendChild(grid);
    mainArea.appendChild(groupDiv);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function openSheet(c) {
  document.getElementById('sheetName').textContent = c.name;
  const roleText = c.role && c.role !== c.dept ? c.role + ' · ' + c.dept : c.dept;
  document.getElementById('sheetRole').textContent = roleText;

  const details = document.getElementById('sheetDetails');
  details.innerHTML = '';
  if (c.phone) {
    details.innerHTML += `<div class="sheet-row"><span class="label">전화번호</span><span>${escapeHtml(c.phone)}</span></div>`;
  }
  if (c.note) {
    details.innerHTML += `<div class="sheet-row"><span class="label">메모</span><span>${escapeHtml(c.note)}</span></div>`;
  }

  const callBtn = document.getElementById('callBtn');
  const noPhoneNote = document.getElementById('noPhoneNote');
  if (c.phone) {
    callBtn.href = 'tel:' + c.phone.replace(/-/g, '');
    callBtn.style.display = 'flex';
    noPhoneNote.style.display = 'none';
  } else {
    callBtn.style.display = 'none';
    noPhoneNote.style.display = 'block';
  }

  overlay.classList.add('open');
}

function closeSheet() {
  overlay.classList.remove('open');
}

overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closeSheet();
});

searchBox.addEventListener('input', () => {
  const q = searchBox.value.trim().toLowerCase();
  if (!q) {
    render(CONTACTS);
    return;
  }
  const filtered = CONTACTS.filter(c =>
    c.name.toLowerCase().includes(q) ||
    c.role.toLowerCase().includes(q) ||
    c.dept.toLowerCase().includes(q)
  );
  render(filtered);
});

render(CONTACTS);
