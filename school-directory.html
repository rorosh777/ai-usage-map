<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --accent: #2b6cb0;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --call-bg: #16a34a;
    --gyomu-bg: #eaf2fb;
    --gyomu-border: #b9d4ef;
    --gyomu-head: #2b6cb0;
    --haengjeong-bg: #eaf7ec;
    --haengjeong-border: #b8e2bd;
    --haengjeong-head: #227a3d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  header {
    padding: 14px 14px 10px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  header h1 {
    margin: 0 0 10px;
    font-size: 17px;
    text-align: center;
  }
  #searchBox {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
  }
  #searchBox:focus { border-color: var(--accent); }

  main {
    padding: 12px;
    max-width: 640px;
    margin: 0 auto;
    padding-bottom: 40px;
  }

  .section-block { margin-bottom: 18px; }
  .section-title {
    font-size: 15px;
    font-weight: 800;
    color: #fff;
    padding: 8px 12px;
    border-radius: 8px 8px 0 0;
  }
  .section-title.gyomu { background: var(--gyomu-head); }
  .section-title.haengjeong { background: var(--haengjeong-head); }

  .contact-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 8px;
    border-radius: 0 0 8px 8px;
  }
  .contact-grid.gyomu { background: var(--gyomu-bg); border: 1px solid var(--gyomu-border); border-top: none; }
  .contact-grid.haengjeong { background: var(--haengjeong-bg); border: 1px solid var(--haengjeong-border); border-top: none; }

  .contact-btn {
    background: var(--card-bg);
    border: 1px solid rgba(0,0,0,0.12);
    border-radius: 6px;
    padding: 8px 4px;
    text-align: center;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-height: 52px;
  }
  .contact-btn:active { background: #f0f0f0; }
  .contact-name {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
  }
  .contact-sub {
    font-size: 10.5px;
    color: var(--muted);
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
  }

  #emptyMsg {
    text-align: center;
    color: var(--muted);
    padding: 30px 0;
    display: none;
    font-size: 14px;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 20;
  }
  .overlay.open { display: flex; }

  .sheet {
    background: var(--card-bg);
    width: 100%;
    max-width: 480px;
    border-radius: 18px 18px 0 0;
    padding: 22px 20px 28px;
    animation: slideUp 0.18s ease-out;
  }
  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .sheet-name { font-size: 21px; font-weight: 700; margin-bottom: 2px; }
  .sheet-role { font-size: 14px; color: var(--muted); margin-bottom: 14px; }
  .sheet-row {
    display: flex;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .sheet-row:last-of-type { border-bottom: none; }
  .sheet-row .label { color: var(--muted); }

  .call-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    margin-top: 18px;
    padding: 15px;
    background: var(--call-bg);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
  }
  .call-btn:active { opacity: 0.85; }

  .close-btn {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 14px;
  }

  .no-phone-note {
    margin-top: 14px;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
  }
</style>

const mainArea = document.getElementById('mainArea');
const emptyMsg = document.getElementById('emptyMsg');
const searchBox = document.getElementById('searchBox');
const overlay = document.getElementById('overlay');

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function render(list) {
  mainArea.innerHTML = '';
  if (list.length === 0) {
    emptyMsg.style.display = 'block';
    return;
  }
  emptyMsg.style.display = 'none';

  ["교무", "행정"].forEach(groupName => {
    const items = list.filter(c => c.group === groupName);
    if (items.length === 0) return;

    const block = document.createElement('div');
    block.className = 'section-block';

    const title = document.createElement('div');
    title.className = 'section-title ' + (groupName === '교무' ? 'gyomu' : 'haengjeong');
    title.textContent = groupName + ' (' + items.length + ')';
    block.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'contact-grid ' + (groupName === '교무' ? 'gyomu' : 'haengjeong');

    items.forEach(c => {
      const btn = document.createElement('div');
      btn.className = 'contact-btn';
      const subHtml = c.sub ? `<div class="contact-sub">${escapeHtml(c.sub)}</div>` : '';
      btn.innerHTML = `<div class="contact-name">${escapeHtml(c.name)}</div>${subHtml}`;
      btn.addEventListener('click', () => openSheet(c));
      grid.appendChild(btn);
    });

    block.appendChild(grid);
    mainArea.appendChild(block);
  });
}

function openSheet(c) {
  document.getElementById('sheetName').textContent = c.name;
  const roleText = c.sub && c.sub !== c.dept ? c.sub + ' · ' + c.dept : c.dept;
  document.getElementById('sheetRole').textContent = roleText;

  const details = document.getElementById('sheetDetails');
  details.innerHTML = '';
  if (c.phone) {
    details.innerHTML += `<div class="sheet-row"><span class="label">전화번호</span><span>${escapeHtml(c.phone)}</span></div>`;
  }

  const callBtn = document.getElementById('callBtn');
  const noPhoneNote = document.getElementById('noPhoneNote');
  if (c.phone) {
    callBtn.href = 'tel:' + c.phone.replace(/-/g, '');
    callBtn.style.display = 'flex';
    noPhoneNote.style.display = 'none';
  } else {
    callBtn.style.display = 'none';
    noPhoneNote.style.display = 'block';
  }

  overlay.classList.add('open');
}

function closeSheet() {
  overlay.classList.remove('open');
}

overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closeSheet();
});

searchBox.addEventListener('input', () => {
  const q = searchBox.value.trim().toLowerCase();
  if (!q) {
    render(CONTACTS);
    return;
  }
  const filtered = CONTACTS.filter(c =>
    c.name.toLowerCase().includes(q) ||
    (c.sub && c.sub.toLowerCase().includes(q)) ||
    c.dept.toLowerCase().includes(q)
  );
  render(filtered);
});

render(CONTACTS);
</script>
